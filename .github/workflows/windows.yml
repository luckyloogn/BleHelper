# reference: https://github.com/zhuzichu520/FluentUI/blob/main/.github/workflows/windows.yml

name: Build (and release) for Windows

on:
  push:
    branches:
      - main
      # TODO: remove this branch before merging into main, it is only here to
      # let the packages be verified on the feature branch.
      - fix/appimage-oldest-lts-build
    tags:
      - '*'
  pull_request:
    branches:
      - main

env:
  targetName: BleHelper.exe
  fileName: BleHelper
  # Version used in the file names: the tag on a tag build. Branch and pull request builds are
  # never released, and their ref name ("fix/something") contains a slash, which cannot appear
  # in a file name, so they get a build number instead.
  appVersion: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  build:
    name: Build and release (${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            qt_ver: 6.8.1
            qt_arch: win64_msvc2022_64
            msvc_arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
        with:
          version: 1.10.2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.qt_arch }}
          cache: 'true'
          cache-key-prefix: 'install-qt-action'
          modules: 'qtshadertools qt5compat qtconnectivity'

      # windows-latest now runs Windows Server 2025 with Visual Studio 2026,
      # whose installation path is no longer fixed, so locate it via vswhere
      - name: Build and package the project
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          if not exist "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" (
            echo Visual Studio with C++ tools was not found
            exit /b 1
          )
          echo Using Visual Studio at "%VS_PATH%"
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.msvc_arch }}
          mkdir build
          cd build
          cmake -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=Release -GNinja ..
          cmake --build . --target all --config Release --parallel
          cmake --build . --target Script-DeployRelease

      - name: Patch
        # fix QTBUG-132202: https://bugreports.qt.io/browse/QTBUG-132202
        shell: pwsh
        run: |
          $owner = "luckyloogn"
          $repo = "build-qtconnectivity"
          $tag = "fix-v6.8.1"
          $assetName = "Qt6Bluetooth.dll"
          $downloadPath = "dist/$assetName"

          $assetUrl = Invoke-RestMethod -Uri "https://api.github.com/repos/$owner/$repo/releases/tags/$tag" | 
            Where-Object { $_.assets.name -eq $assetName } |
            Select-Object -ExpandProperty assets |
            Select-Object -ExpandProperty browser_download_url

          if (-not $assetUrl) {
            Write-Error "Asset $assetName not found!"
            exit 1
          }

          if (Test-Path $downloadPath) {
              Write-Host "$assetName already exists in $downloadDir. Deleting the old file..."
              Remove-Item $downloadPath -Force
          }

          Write-Host "Downloading $assetName..."
          Invoke-WebRequest -Uri $assetUrl -OutFile $downloadPath

          if (Test-Path $downloadPath) {
            Write-Host "$assetName downloaded successfully to $downloadPath!"
          } else {
            Write-Error "Download $assetName to $downloadPath failed!"
            exit 1
          }

      # The portable build: the same files the installer would copy, zipped for people who do not
      # want to run a setup program.
      - name: Build the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $zip = "package/${{ env.fileName }}-${{ env.appVersion }}-${{ matrix.arch }}.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path dist/* -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object Name, Length

      - name: Upload the portable zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.fileName }}-${{ env.appVersion }}-${{ matrix.arch }}-zip
          path: package/*.zip
          if-no-files-found: error

      - name: Create installer
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: zhuzichu520/inno-setup-action@v1.0.1
        with:
          filepath: package/InstallerScript.iss

      # Inno Setup writes package/installer.exe; give it the same name scheme as the other formats
      - name: Rename the installer
        if: startsWith(github.event.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $installer = "package/${{ env.fileName }}-${{ env.appVersion }}-${{ matrix.arch }}-setup.exe"
          Move-Item -Path "package/installer.exe" -Destination $installer -Force
          Get-Item $installer | Select-Object Name, Length

      - name: Upload the installer
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.fileName }}-${{ env.appVersion }}-${{ matrix.arch }}-installer
          path: package/*-setup.exe
          if-no-files-found: error

      - name: Upload release (portable zip)
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: package/*.zip
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true

      - name: Upload release (installer)
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: package/*-setup.exe
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
