# reference: https://github.com/zhuzichu520/FluentUI/blob/main/.github/workflows/ubuntu.yml

name: Build (and release) for Linux

on:
  push:
    branches:
      - main
      # TODO: remove this branch before merging into main, it is only here to
      # let the packages be verified on the feature branch.
      - fix/appimage-oldest-lts-build
    tags:
      - '*'
  pull_request:
    branches:
      - main

env:
  targetName: BleHelper
  # Version used in the file names: the tag on a tag build. Branch and pull request builds are
  # never released, and their ref name ("fix/something") contains a slash, which cannot appear
  # in a file name, so they get a build number instead.
  appVersion: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}

    # The runner falls back to /bin/sh inside a container, and dash knows no "pipefail".
    defaults:
      run:
        shell: bash

    # Packages must be built on the oldest still-supported Ubuntu LTS.
    # linuxdeploy bundles system libraries (libsystemd / libkrb5 / libgcrypt / libxkbcommon /
    # libglib / libdbus ...) from the build machine, so building on Ubuntu 24.04 produces a
    # bundle that requires GLIBC_2.38 and crashes on older distributions.
    # Building inside a container rather than on an ubuntu-22.04 runner also keeps us
    # independent of that runner label, which is already in the deprecation process.
    container:
      image: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        # "arch" is the Debian name (used by dpkg, snap and the artifact names), "deploy_arch" is
        # the name AppImage tooling uses; both refer to the same CPU architecture.
        include:
          - arch: amd64
            runner: ubuntu-latest
            container: ubuntu:22.04
            glibc_max: '2.35'
            # the bundle itself needs 2.34; the AppImage runtime is not shipped in the .deb
            libc_min: '2.34'
            qt_ver: '6.8.1'
            qt_arch: linux_gcc_64
            deploy_arch: x86_64
            snap_base: core22
          # Qt ships its arm64 Linux binaries only built on Ubuntu 24.04, they need GLIBC_2.38
          # and GLIBCXX_3.4.32, so even qmlimportscanner cannot run inside a 22.04 container.
          # arm64 therefore targets Ubuntu 24.04+ only.
          - arch: arm64
            runner: ubuntu-24.04-arm
            container: ubuntu:24.04
            glibc_max: '2.38'
            libc_min: '2.38'
            qt_ver: '6.8.1'
            qt_arch: linux_gcc_arm64
            deploy_arch: aarch64
            snap_base: core24

    env:
      # containers usually have no FUSE, so let linuxdeploy / appimagetool extract-and-run
      APPIMAGE_EXTRACT_AND_RUN: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install container prerequisites
        run: |
          # the archive mirrors fail every now and then, so give apt a couple of tries
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              echo "failed, retrying: $*"
              sleep 15
            done
            return 1
          }
          retry apt-get -o Acquire::Retries=5 update
          retry apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            ca-certificates curl wget git sudo zip unzip xz-utils \
            build-essential cmake ninja-build dpkg \
            file patchelf zstd libfuse2 openssl \
            python3 python3-pip python-is-python3 \
            libxcb-cursor0 libgl1-mesa-dev libxcb1-dev libgtk-3-dev libxkbcommon-x11-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-sync-dev \
            libxcb-render-util0-dev libxcb-shm0-dev
          git config --global --add safe.directory '*'
          echo "--- toolchain (glibc should be ${{ matrix.glibc_max }}) ---"
          gcc --version | head -1
          cmake --version | head -1
          ldd --version | head -1

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # install-qt-action installs aqtinstall with pip. Ubuntu 24.04 marks the system Python as
      # externally managed (PEP 668), so that pip call is refused there; a venv has no such
      # restriction, and being the container's own interpreter it can never demand a newer
      # GLIBC than the container provides (unlike the hosted tool cache). Ubuntu 22.04 has no
      # such marker, so there the system Python is used as it is.
      - name: Prepare a Python for aqtinstall
        run: |
          if python3 -c 'import os, sys, sysconfig; sys.exit(0 if os.path.exists(os.path.join(sysconfig.get_path("stdlib"), "EXTERNALLY-MANAGED")) else 1)'; then
            echo "system python is externally managed, using a venv"
            apt-get install -y --no-install-recommends python3-venv
            python3 -m venv /opt/aqt-venv
            /opt/aqt-venv/bin/python -m pip install --upgrade pip
            echo "/opt/aqt-venv/bin" >> "$GITHUB_PATH"
          else
            echo "system python can be used as it is"
          fi
          python3 --version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.qt_arch }}
          cache: 'true'
          cache-key-prefix: 'install-qt-action'
          modules: 'qtshadertools qt5compat qtconnectivity'
          # setup-python would pull a Python from the hosted tool cache, which is built on
          # Ubuntu 24.04 (glibc 2.39) and requires GLIBC_2.38, so it cannot run inside the
          # ubuntu:22.04 container. The venv prepared above is used instead.
          setup-python: 'false'

      # miurahr/install-linuxdeploy-action still runs on Node.js 20, which GitHub now force-runs on
      # Node.js 24 and reports as deprecated; its newest release has the same problem. It only
      # downloads three AppImages, so they are fetched directly instead. That also drops the
      # action's dependency on wget, which the slim container image does not ship.
      - name: Install linuxdeploy
        run: |
          mkdir -p "$RUNNER_TEMP/linuxdeploy"
          cd "$RUNNER_TEMP/linuxdeploy"
          for tool in linuxdeploy linuxdeploy-plugin-qt linuxdeploy-plugin-appimage; do
            curl -fsSL --retry 3 --retry-delay 5 -o "$tool" \
              "https://github.com/linuxdeploy/$tool/releases/download/continuous/$tool-${{ matrix.deploy_arch }}.AppImage"
            chmod +x "$tool"
          done
          echo "$RUNNER_TEMP/linuxdeploy" >> "$GITHUB_PATH"
          ls -l

      - name: Build the project
        run: |
          echo "=== Qt ==="
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          "$QT_ROOT_DIR/bin/moc" --version || true
          mkdir -p build
          cd build
          # On failure the log ends up in the job summary, which is much easier to look at
          # than a log that has to be downloaded from the web interface.
          if ! cmake -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -GNinja .. > ../configure.log 2>&1; then
            { echo '### CMake configure failed'; echo '```'; tail -n 150 ../configure.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! cmake --build . --target all --config Release --parallel > ../build.log 2>&1; then
            { echo '### Build failed'; echo '```'; tail -n 200 ../build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Copy files
        run: |
          mkdir -p ./dist/
          mkdir -p ./dist/usr/bin/
          mkdir -p ./package/
          cp ./BleHelper/resources/images/icons/logo.svg ./dist/${{ env.targetName }}.svg
          cp ./build/BleHelper/BleHelper ./dist/${{ env.targetName }}
          cp -r ./build/BleHelper/i18n ./dist/usr/bin/i18n/

      - name: Build AppImage
        run: |
          # make sure Qt plugin finds QML sources so it can deploy the imported files
          export QML_SOURCES_PATHS=./
          # installed by the "Install linuxdeploy" step above
          LINUXDEPLOY=$(command -v linuxdeploy)
          "$LINUXDEPLOY" --plugin=qt --output=appimage --create-desktop-file --icon-file=./dist/${{ env.targetName }}.svg --executable=./dist/${{ env.targetName }} --appdir ./dist/
          # AppImage naming convention: <Name>-<Version>-<Arch>.AppImage, must not contain "linux"
          mv ${{ env.targetName }}-*.AppImage ./package/${{ env.targetName }}-${{ env.appVersion }}-${{ matrix.deploy_arch }}.AppImage

      # Unpacks the AppImage once: the payload is what the other formats are built from, so they
      # ship exactly the same files, and the GLIBC versions it needs can be checked here.
      - name: Unpack and check the AppImage payload
        run: |
          chmod +x ./package/${{ env.targetName }}-${{ env.appVersion }}-${{ matrix.deploy_arch }}.AppImage
          ./package/${{ env.targetName }}-${{ env.appVersion }}-${{ matrix.deploy_arch }}.AppImage --appimage-extract > /dev/null
          echo "=== GLIBC versions referenced by the bundle (must not exceed ${{ matrix.glibc_max }}) ==="
          find squashfs-root/usr/bin squashfs-root/usr/lib -type f \
            \( -name '*.so*' -o -path '*/usr/bin/*' \) \
            -exec sh -c 'objdump -T "$1" 2>/dev/null | grep -o "GLIBC_2\.[0-9]*"' _ {} \; \
            | sort -uV || true

      - name: Build Debian package
        env:
          # the bundled Qt and system libraries set the floor for libc6
          MIN_LIBC: ${{ matrix.libc_min }}
        run: bash packaging/make-deb.sh squashfs-root "${appVersion#v}" ${{ matrix.arch }} ./package

      # snapd is not available inside the build container, so only the tree is prepared here and
      # turned into a .snap by the "snap" job below.
      - name: Build the snap tree
        env:
          SNAP_BASE: ${{ matrix.snap_base }}
        run: |
          bash packaging/make-snap-tree.sh squashfs-root "${appVersion#v}" ${{ matrix.arch }} ./snap
          tar -C ./snap -czf ./snap-tree.tar.gz snap-tree
          rm -rf ./snap

      # Every artifact is named <Name>-<version>-<arch>-<format>, with the Debian architecture
      # names (amd64 / arm64) used consistently, so the list in the Actions UI reads as one set.
      # Only the files inside are named according to their own format's convention.
      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.targetName }}-${{ env.appVersion }}-${{ matrix.arch }}-appimage
          path: ./package/*.AppImage
          if-no-files-found: error

      - name: Upload the Debian package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.targetName }}-${{ env.appVersion }}-${{ matrix.arch }}-deb
          path: ./package/*.deb
          if-no-files-found: error

      # Intermediate product: the tree that the "snap" job turns into a .snap
      - name: Upload the snap tree
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.targetName }}-${{ env.appVersion }}-${{ matrix.arch }}-snap-tree
          path: ./snap-tree.tar.gz
          if-no-files-found: error

      - name: Upload release
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./package/*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true

  snap:
    name: Pack snap ${{ matrix.arch }}
    needs: build
    # one architecture failing should not keep the other one from being packed
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest

    # "snap pack" only turns a directory into a squashfs, it does not run anything of the
    # package, so both architectures can be packed on the same machine.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            snap_base: core22
          - arch: arm64
            snap_base: core24

    steps:
      - name: Download the snap tree
        id: tree
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.targetName }}-${{ env.appVersion }}-${{ matrix.arch }}-snap-tree

      - name: Pack the snap
        if: steps.tree.outcome == 'success'
        run: |
          tar -xzf snap-tree.tar.gz
          sudo apt-get update -qq
          sudo apt-get install -y squashfs-tools
          # mksquashfs writes the files as root, so the tree is handed to root as well
          sudo chown -R root:root snap-tree
          mkdir -p ./snap-out
          # Take the version from the environment instead of reading meta/snap.yaml: after the
          # chown above that file belongs to root and the unprivileged runner user cannot read it.
          VERSION="${{ env.appVersion }}"
          VERSION="${VERSION#v}"
          # A snap is nothing but a squashfs of the tree plus meta/snap.yaml. "snap pack" cannot
          # be relied on here: the runner images block snapd from being installed, so the
          # squashfs is built directly.
          sudo mksquashfs snap-tree "./snap-out/blehelper_${VERSION}_${{ matrix.arch }}.snap" \
            -noappend -comp xz -all-root -no-xattrs -no-progress
          ls -l ./snap-out

      - name: Upload the snap
        if: steps.tree.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.targetName }}-${{ env.appVersion }}-${{ matrix.arch }}-snap
          path: ./snap-out/*.snap
          if-no-files-found: error

      - name: Upload release
        if: ${{ steps.tree.outcome == 'success' && startsWith(github.event.ref, 'refs/tags/') }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./snap-out/*.snap
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
