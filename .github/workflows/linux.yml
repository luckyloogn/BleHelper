# reference: https://github.com/zhuzichu520/FluentUI/blob/main/.github/workflows/ubuntu.yml

name: Build (and release) for Linux

on:
  push:
    branches:
      - main
      # TODO: remove this branch before merging into main, it is only here to
      # let the packages be verified on the feature branch.
      - fix/appimage-oldest-lts-build
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.arch }}
    permissions:
      contents: write
    runs-on: ${{ matrix.runner }}

    # The runner falls back to /bin/sh inside a container, and dash knows no "pipefail".
    defaults:
      run:
        shell: bash

    # Packages must be built on the oldest still-supported Ubuntu LTS.
    # linuxdeploy bundles system libraries (libsystemd / libkrb5 / libgcrypt / libxkbcommon /
    # libglib / libdbus ...) from the build machine, so building on Ubuntu 24.04 produces a
    # bundle that requires GLIBC_2.38 and crashes on older distributions.
    # Building inside a container rather than on an ubuntu-22.04 runner also keeps us
    # independent of that runner label, which is already in the deprecation process.
    container:
      image: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            container: ubuntu:22.04
            glibc_max: '2.35'
            # the bundle itself needs 2.34; the AppImage runtime is not shipped in the .deb
            libc_min: '2.34'
            qt_ver: '6.8.1'
            qt_arch: linux_gcc_64
            deploy_arch: x86_64
            deb_arch: amd64
          # Qt ships its arm64 Linux binaries only built on Ubuntu 24.04, they need GLIBC_2.38
          # and GLIBCXX_3.4.32, so even qmlimportscanner cannot run inside a 22.04 container.
          # arm64 therefore targets Ubuntu 24.04+ only.
          - arch: arm64
            runner: ubuntu-24.04-arm
            container: ubuntu:24.04
            glibc_max: '2.38'
            libc_min: '2.38'
            qt_ver: '6.8.1'
            qt_arch: linux_gcc_arm64
            deploy_arch: aarch64
            deb_arch: arm64

    env:
      targetName: BleHelper
      # Version used in the file names: the tag on a tag build. Branch and pull request builds
      # are never released, and their ref name ("fix/something") contains a slash, which cannot
      # appear in a file name, so they get a build number instead.
      appVersion: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.run_number) }}
      # containers usually have no FUSE, so let linuxdeploy / appimagetool extract-and-run
      APPIMAGE_EXTRACT_AND_RUN: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget git sudo zip unzip xz-utils \
            build-essential cmake ninja-build dpkg \
            file patchelf zstd libfuse2 openssl \
            python3 python3-pip python3-venv python-is-python3 \
            libxcb-cursor0 libgl1-mesa-dev libxcb1-dev libgtk-3-dev libxkbcommon-x11-dev \
            libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-sync-dev \
            libxcb-render-util0-dev libxcb-shm0-dev
          git config --global --add safe.directory '*'
          echo "--- toolchain (glibc should be ${{ matrix.glibc_max }}) ---"
          gcc --version | head -1
          cmake --version | head -1
          ldd --version | head -1

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # install-qt-action installs aqtinstall with pip. Ubuntu 24.04 marks the system Python as
      # externally managed (PEP 668), so that pip call is refused there. A venv has no such
      # restriction and, unlike the hosted tool cache, it belongs to this container, so it can
      # never demand a newer GLIBC than the container provides.
      - name: Prepare a Python for aqtinstall
        run: |
          python3 -m venv /opt/aqt-venv
          /opt/aqt-venv/bin/python -m pip install --upgrade pip
          echo "/opt/aqt-venv/bin" >> "$GITHUB_PATH"
          echo "--- python that install-qt-action will use ---"
          /opt/aqt-venv/bin/python --version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          arch: ${{ matrix.qt_arch }}
          cache: 'true'
          cache-key-prefix: 'install-qt-action'
          modules: 'qtshadertools qt5compat qtconnectivity'
          # setup-python would pull a Python from the hosted tool cache, which is built on
          # Ubuntu 24.04 (glibc 2.39) and requires GLIBC_2.38, so it cannot run inside the
          # ubuntu:22.04 container. The venv prepared above is used instead.
          setup-python: 'false'

      - name: Install Qt linux deploy
        uses: miurahr/install-linuxdeploy-action@v1
        with:
          plugins: qt appimage

      - name: Build the project
        run: |
          echo "=== Qt ==="
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          "$QT_ROOT_DIR/bin/moc" --version || true
          mkdir -p build
          cd build
          # On failure the log ends up in the job summary, which is much easier to look at
          # than a log that has to be downloaded from the web interface.
          if ! cmake -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -GNinja .. > ../configure.log 2>&1; then
            { echo '### CMake configure failed'; echo '```'; tail -n 150 ../configure.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! cmake --build . --target all --config Release --parallel > ../build.log 2>&1; then
            { echo '### Build failed'; echo '```'; tail -n 200 ../build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Copy files
        run: |
          mkdir -p ./dist/
          mkdir -p ./dist/usr/bin/
          mkdir -p ./package/
          cp ./BleHelper/resources/images/icons/logo.svg ./dist/${{ env.targetName }}.svg
          cp ./build/BleHelper/BleHelper ./dist/${{ env.targetName }}
          cp -r ./build/BleHelper/i18n ./dist/usr/bin/i18n/

      - name: Build AppImage
        run: |
          # make sure Qt plugin finds QML sources so it can deploy the imported files
          export QML_SOURCES_PATHS=./
          # the tool is named after the architecture it was downloaded for
          LINUXDEPLOY=$(command -v linuxdeploy-${{ matrix.deploy_arch }}.AppImage || command -v linuxdeploy)
          "$LINUXDEPLOY" --plugin=qt --output=appimage --create-desktop-file --icon-file=./dist/${{ env.targetName }}.svg --executable=./dist/${{ env.targetName }} --appdir ./dist/
          # AppImage naming convention: <Name>-<Version>-<Arch>.AppImage, must not contain "linux"
          mv ${{ env.targetName }}-*.AppImage ./package/${{ env.targetName }}-${{ env.appVersion }}-${{ matrix.deploy_arch }}.AppImage

      # Unpacks the AppImage once: the payload is what the other formats are built from, so they
      # ship exactly the same files, and the GLIBC versions it needs can be checked here.
      - name: Unpack and check the AppImage payload
        run: |
          chmod +x ./package/${{ env.targetName }}-${{ env.appVersion }}-${{ matrix.deploy_arch }}.AppImage
          ./package/${{ env.targetName }}-${{ env.appVersion }}-${{ matrix.deploy_arch }}.AppImage --appimage-extract > /dev/null
          echo "=== GLIBC versions referenced by the bundle (must not exceed ${{ matrix.glibc_max }}) ==="
          find squashfs-root/usr/bin squashfs-root/usr/lib -type f \
            \( -name '*.so*' -o -path '*/usr/bin/*' \) \
            -exec sh -c 'objdump -T "$1" 2>/dev/null | grep -o "GLIBC_2\.[0-9]*"' _ {} \; \
            | sort -uV || true

      - name: Build Debian package
        env:
          # the bundled Qt and system libraries set the floor for libc6
          MIN_LIBC: ${{ matrix.libc_min }}
        run: bash packaging/make-deb.sh squashfs-root "${appVersion#v}" ${{ matrix.deb_arch }} ./package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.targetName }}-${{ env.appVersion }}-${{ matrix.deploy_arch }}
          path: ./package/*
          if-no-files-found: error

      - name: Upload release
        if: startsWith(github.event.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./package/*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
